<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Kainthla Tuition Academy | Kumarsain, Shimla</title>

  <meta name="description" content="Kainthla Tuition Academy, Kumarsain, District Shimla, Himachal Pradesh. Academic coaching for school students, JEE/NEET foundation and entrance examinations.">
  <meta name="theme-color" content="#071a35">

  <!-- Open Graph -->
  <meta property="og:title" content="Kainthla Tuition Academy">
  <meta property="og:description" content="Trusted Education for a Brighter Future — Kumarsain, District Shimla, Himachal Pradesh.">
  <meta property="og:type" content="website">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="https://i.ibb.co/5gTBTFz2/file-00000000e0b88211bb4c581b7f24acb0.png">

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --navy: #071a35;
      --navy2: #0d2b50;
      --navy3: #123b68;
      --gold: #e5b84b;
      --gold2: #f6d878;
      --white: #ffffff;
      --light: #f6f8fb;
      --text: #18263b;
      --muted: #69778c;
      --border: rgba(7,26,53,.10);
      --shadow: 0 18px 55px rgba(7,26,53,.10);
      --radius: 20px;
      --max: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 85px;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.lock {
      overflow: hidden;
    }

    img {
      display: block;
      width: 100%;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(calc(100% - 34px), var(--max));
      margin: auto;
    }

    /* ================= NAVBAR ================= */

    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      background: rgba(255,255,255,.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(7,26,53,.08);
    }

    .nav {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand img {
      width: 48px;
      height: 48px;
      object-fit: contain;
      flex-shrink: 0;
    }

    .brand-name {
      font-family: "Manrope", sans-serif;
      font-size: .83rem;
      line-height: 1.1;
      font-weight: 800;
      color: var(--navy);
      max-width: 170px;
    }

    .nav-links {
      display: none;
      align-items: center;
      gap: 21px;
    }

    .nav-links a {
      font-size: .82rem;
      font-weight: 700;
      color: #4d5b70;
      transition: .2s;
    }

    .nav-links a:hover {
      color: var(--navy);
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .call-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      background: var(--gold);
      color: var(--navy);
      border-radius: 11px;
      min-height: 43px;
      padding: 0 15px;
      font-size: .78rem;
      font-weight: 800;
      transition: .25s;
      box-shadow: 0 8px 25px rgba(229,184,75,.25);
    }

    .call-btn:hover {
      background: var(--gold2);
      transform: translateY(-2px);
    }

    .menu-btn {
      width: 43px;
      height: 43px;
      border-radius: 11px;
      border: 1px solid var(--border);
      background: white;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .hamburger {
      width: 19px;
      display: grid;
      gap: 4px;
    }

    .hamburger span {
      height: 2px;
      background: var(--navy);
      border-radius: 4px;
      transition: .25s;
    }

    .menu-btn.active span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-btn.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-btn.active span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .mobile-menu {
      display: none;
      border-top: 1px solid var(--border);
      padding: 10px 0 20px;
      background: white;
    }

    .mobile-menu.active {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 11px 0;
      font-weight: 700;
      color: #4d5b70;
    }

    /* ================= HERO ================= */

    .hero {
      min-height: 100svh;
      padding-top: 76px;
      color: white;
      background:
        radial-gradient(circle at 85% 15%, rgba(229,184,75,.15), transparent 30%),
        linear-gradient(135deg,#05162d,#0c2a4d 58%,#071a35);
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .hero:before {
      content: "";
      position: absolute;
      width: 390px;
      height: 390px;
      border: 1px solid rgba(229,184,75,.15);
      border-radius: 50%;
      right: -220px;
      top: 100px;
    }

    .hero-content {
      position: relative;
      z-index: 2;
      padding: 60px 0 75px;
      display: grid;
      gap: 40px;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 7px 12px;
      border: 1px solid rgba(229,184,75,.3);
      background: rgba(229,184,75,.08);
      color: var(--gold2);
      border-radius: 999px;
      font-size: .7rem;
      font-weight: 800;
      letter-spacing: .1em;
      text-transform: uppercase;
      margin-bottom: 18px;
    }

    .badge i {
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
    }

    .hero h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(2.8rem, 10vw, 5.8rem);
      line-height: .98;
      letter-spacing: -.06em;
      margin-bottom: 18px;
    }

    .hero h1 span {
      color: var(--gold);
    }

    .location {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255,255,255,.8);
      font-weight: 700;
      margin-bottom: 10px;
    }

    .location svg {
      width: 18px;
      color: var(--gold);
    }

    .hero-subtitle {
      color: rgba(255,255,255,.72);
      font-size: 1.05rem;
      margin-bottom: 28px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .hero-btn {
      min-height: 50px;
      padding: 0 20px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      font-size: .86rem;
      transition: .25s;
    }

    .hero-primary {
      background: var(--gold);
      color: var(--navy);
      box-shadow: 0 10px 28px rgba(229,184,75,.25);
    }

    .hero-primary:hover {
      background: var(--gold2);
      transform: translateY(-2px);
    }

    .hero-secondary {
      border: 1px solid rgba(255,255,255,.25);
      color: white;
      background: rgba(255,255,255,.06);
    }

    .hero-secondary:hover {
      background: rgba(255,255,255,.12);
      transform: translateY(-2px);
    }

    .hero-image-box {
      position: relative;
      border-radius: 25px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.14);
      box-shadow: 0 30px 80px rgba(0,0,0,.3);
      aspect-ratio: 4 / 3;
      background: #102b4d;
    }

    .hero-image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-image-box:after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(to top,rgba(3,13,28,.5),transparent 60%);
    }

    /* ================= GENERAL ================= */

    .section {
      padding: 85px 0;
    }

    .light {
      background: var(--light);
    }

    .section-head {
      max-width: 720px;
      margin-bottom: 42px;
    }

    .eyebrow {
      color: #a47814;
      font-size: .72rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .15em;
      margin-bottom: 11px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }

    .eyebrow:before {
      content: "";
      width: 25px;
      height: 2px;
      background: var(--gold);
    }

    .section-title {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: clamp(2rem,6vw,3.2rem);
      line-height: 1.08;
      letter-spacing: -.05em;
      margin-bottom: 15px;
    }

    .section-text {
      color: var(--muted);
      font-size: 1rem;
    }

    /* ================= ABOUT ================= */

    .about-grid {
      display: grid;
      gap: 28px;
      align-items: center;
    }

    .about-text {
      color: var(--muted);
      font-size: 1.04rem;
      max-width: 720px;
    }

    .about-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .about-card:before {
      content: "";
      position: absolute;
      left: 0;
      top: 0;
      width: 5px;
      height: 100%;
      background: var(--gold);
    }

    .about-card small {
      color: #9b7419;
      font-size: .7rem;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: .12em;
    }

    .about-card h3 {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: 1.45rem;
      margin: 7px 0;
    }

    .about-card p {
      color: var(--muted);
      font-size: .9rem;
    }

    /* ================= COURSES ================= */

    .courses-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 17px;
    }

    .course {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      overflow: hidden;
      box-shadow: 0 8px 30px rgba(7,26,53,.05);
      transition: .3s;
    }

    .course:hover {
      transform: translateY(-5px);
      border-color: rgba(229,184,75,.5);
      box-shadow: 0 20px 45px rgba(7,26,53,.1);
    }

    .course-img {
      height: 180px;
      overflow: hidden;
      background: #edf1f6;
    }

    .course-img img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .45s;
    }

    .course:hover .course-img img {
      transform: scale(1.04);
    }

    .course-body {
      padding: 23px;
    }

    .course-icon {
      width: 47px;
      height: 47px;
      border-radius: 13px;
      background: #fdf5df;
      color: #a47814;
      display: grid;
      place-items: center;
      margin-bottom: 16px;
    }

    .course-icon svg {
      width: 23px;
    }

    .course h3 {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: 1.16rem;
      line-height: 1.25;
      margin-bottom: 8px;
    }

    .course p {
      color: var(--muted);
      font-size: .88rem;
      margin-bottom: 13px;
    }

    .subjects {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 19px;
    }

    .subject {
      padding: 5px 9px;
      border-radius: 999px;
      background: #f1f4f8;
      color: #506078;
      font-size: .7rem;
      font-weight: 700;
    }

    .course-call {
      display: flex;
      width: 100%;
    }

    /* ================= FOUNDER ================= */

    .founder-card {
      display: grid;
      background: var(--navy);
      border-radius: 26px;
      overflow: hidden;
      box-shadow: 0 25px 65px rgba(7,26,53,.17);
    }

    .founder-photo {
      min-height: 390px;
      background: #102b4d;
    }

    .founder-photo img {
      height: 100%;
      min-height: 390px;
      object-fit: cover;
    }

    .founder-info {
      padding: 42px 28px;
      color: white;
      background:
        radial-gradient(circle at 100% 0,rgba(229,184,75,.13),transparent 40%),
        var(--navy);
    }

    .founder-info .eyebrow {
      color: var(--gold2);
    }

    .founder-info h2 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(2.2rem,8vw,4rem);
      line-height: 1;
      letter-spacing: -.05em;
      margin-bottom: 10px;
    }

    .founder-role {
      color: rgba(255,255,255,.65);
      font-size: .95rem;
    }

    .founder-achievement {
      max-width: 340px;
      margin-top: 28px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255,255,255,.12);
      cursor: pointer;
    }

    .founder-achievement img {
      height: 175px;
      object-fit: cover;
    }

    .founder-achievement p {
      padding: 10px 12px;
      font-size: .72rem;
      color: rgba(255,255,255,.6);
      background: rgba(255,255,255,.04);
    }

    /* ================= ACHIEVEMENTS ================= */

    .achievement-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .achievement {
      background: var(--light);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
      cursor: pointer;
    }

    .achievement-img {
      aspect-ratio: 4/3;
      overflow: hidden;
    }

    .achievement img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .achievement:hover img {
      transform: scale(1.04);
    }

    .achievement-info {
      padding: 17px;
    }

    .achievement-info h3 {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: 1rem;
      margin-bottom: 3px;
    }

    .achievement-info p {
      color: var(--muted);
      font-size: .78rem;
    }

    .note {
      margin-top: 22px;
      padding: 14px 16px;
      background: #fffbf0;
      border-left: 3px solid var(--gold);
      border-radius: 8px;
      color: #6e5c31;
      font-size: .77rem;
    }

    /* ================= GALLERY ================= */

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2,1fr);
      gap: 10px;
    }

    .gallery-item {
      aspect-ratio: 1/1;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      background: #e3e8ef;
    }

    .gallery-item.wide {
      grid-column: span 2;
      aspect-ratio: 16/9;
    }

    .gallery-item img {
      height: 100%;
      object-fit: cover;
      transition: .4s;
    }

    .gallery-item:hover img {
      transform: scale(1.05);
      filter: brightness(.88);
    }

    /* ================= CONTACT ================= */

    .contact-grid {
      display: grid;
      gap: 20px;
    }

    .contact-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 27px;
      box-shadow: 0 9px 35px rgba(7,26,53,.05);
    }

    .contact-card h3 {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: 1.25rem;
      margin-bottom: 16px;
    }

    .contact-row {
      display: flex;
      gap: 13px;
      align-items: flex-start;
      padding: 13px 0;
      border-bottom: 1px solid rgba(7,26,53,.07);
    }

    .contact-row:last-child {
      border-bottom: 0;
    }

    .contact-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #fdf5df;
      color: #a47814;
      display: grid;
      place-items: center;
      flex-shrink: 0;
    }

    .contact-icon svg {
      width: 18px;
    }

    .contact-label {
      font-size: .68rem;
      color: #8793a5;
      text-transform: uppercase;
      letter-spacing: .08em;
      font-weight: 800;
    }

    .contact-value {
      color: var(--navy);
      font-weight: 700;
      font-size: .92rem;
    }

    .contact-buttons {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .dark-button {
      min-height: 48px;
      border-radius: 11px;
      background: var(--navy);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      font-weight: 800;
      font-size: .83rem;
      transition: .25s;
    }

    .dark-button:hover {
      background: var(--navy2);
      transform: translateY(-2px);
    }

    .map-card {
      min-height: 300px;
      border-radius: var(--radius);
      overflow: hidden;
      background:
        linear-gradient(rgba(7,26,53,.84),rgba(7,26,53,.9)),
        repeating-linear-gradient(45deg,#dfe5ed 0,#dfe5ed 10px,#edf1f6 10px,#edf1f6 20px);
      display: grid;
      place-items: center;
      text-align: center;
      color: white;
      padding: 25px;
    }

    .map-card svg {
      width: 38px;
      color: var(--gold);
      margin: auto auto 10px;
    }

    .map-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 1.4rem;
      margin-bottom: 5px;
    }

    .map-card p {
      color: rgba(255,255,255,.65);
      font-size: .85rem;
      margin-bottom: 20px;
    }

    /* ================= CTA ================= */

    .final-cta {
      padding: 78px 0;
      color: white;
      text-align: center;
      background:
        radial-gradient(circle at 50% 0,rgba(229,184,75,.16),transparent 38%),
        linear-gradient(135deg,#06162e,#0d2b50);
    }

    .final-cta h2 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(2rem,7vw,3.7rem);
      line-height: 1.08;
      letter-spacing: -.05em;
      margin-bottom: 13px;
    }

    .final-cta h2 span {
      color: var(--gold);
    }

    .final-cta p {
      color: rgba(255,255,255,.68);
      margin-bottom: 25px;
    }

    /* ================= FOOTER ================= */

    footer {
      background: #041225;
      color: white;
      padding: 45px 0 25px;
    }

    .footer-grid {
      display: grid;
      gap: 30px;
    }

    .footer-brand {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .footer-brand img {
      width: 55px;
      height: 55px;
      object-fit: contain;
    }

    .footer-brand strong {
      font-family: "Manrope", sans-serif;
      font-size: .95rem;
    }

    .footer-text {
      color: rgba(255,255,255,.58);
      font-size: .82rem;
      margin-top: 15px;
      max-width: 450px;
    }

    .footer-contact {
      display: grid;
      gap: 7px;
      color: rgba(255,255,255,.65);
      font-size: .83rem;
    }

    .footer-contact a:hover {
      color: var(--gold);
    }

    .copyright {
      border-top: 1px solid rgba(255,255,255,.09);
      margin-top: 30px;
      padding-top: 20px;
      color: rgba(255,255,255,.42);
      font-size: .72rem;
      text-align: center;
    }

    /* ================= LIGHTBOX ================= */

    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(2,9,20,.94);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .lightbox.active {
      display: flex;
    }

    .lightbox img {
      max-width: 95vw;
      max-height: 88vh;
      width: auto;
      object-fit: contain;
      border-radius: 12px;
    }

    .close-lightbox {
      position: fixed;
      right: 18px;
      top: 18px;
      width: 44px;
      height: 44px;
      border: 1px solid rgba(255,255,255,.2);
      background: rgba(255,255,255,.08);
      color: white;
      border-radius: 50%;
      cursor: pointer;
      font-size: 25px;
      line-height: 1;
    }

    /* ================= REVEAL ================= */

    .reveal {
      opacity: 0;
      transform: translateY(22px);
      transition: opacity .7s ease, transform .7s ease;
    }

    .reveal.visible {
      opacity: 1;
      transform: none;
      </body>
</html>
