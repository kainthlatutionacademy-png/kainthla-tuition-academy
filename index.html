<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Kainthla Tuition Academy | Kumarsain, Shimla</title>

  <meta
    name="description"
    content="Kainthla Tuition Academy, Kumarsain, District Shimla, Himachal Pradesh. Explore academic courses, JEE/NEET foundation and entrance coaching."
  />
  <meta name="theme-color" content="#071a35" />

  <!-- Open Graph -->
  <meta property="og:title" content="Kainthla Tuition Academy" />
  <meta
    property="og:description"
    content="Trusted Education for a Brighter Future — Kumarsain, District Shimla, Himachal Pradesh."
  />
  <meta property="og:type" content="website" />
  <meta
    property="og:image"
    content="https://i.ibb.co/3y1VVy4D/file-00000000229c82088e8b82d2548520f8.png"
  />

  <!-- Favicon -->
  <link
    rel="icon"
    type="image/png"
    href="https://i.ibb.co/5gTBTFz2/file-00000000e0b88211bb4c581b7f24acb0.png"
  />

  <!-- Premium Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Manrope:wght@500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    :root {
      --navy: #071a35;
      --navy-2: #0b2548;
      --navy-3: #12345d;
      --gold: #e5b84b;
      --gold-light: #f7d978;
      --white: #ffffff;
      --off-white: #f7f9fc;
      --text: #17243a;
      --muted: #65748b;
      --border: rgba(7, 26, 53, 0.1);
      --shadow: 0 18px 55px rgba(7, 26, 53, 0.1);
      --radius: 20px;
      --container: 1180px;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 82px;
    }

    body {
      font-family: "DM Sans", sans-serif;
      color: var(--text);
      background: var(--white);
      line-height: 1.6;
      overflow-x: hidden;
    }

    body.menu-open {
      overflow: hidden;
    }

    img {
      display: block;
      max-width: 100%;
    }

    a {
      color: inherit;
      text-decoration: none;
    }

    button {
      font: inherit;
    }

    .container {
      width: min(calc(100% - 36px), var(--container));
      margin-inline: auto;
    }

    /* =========================
       SECTION SYSTEM
    ========================== */

    .section {
      padding: 88px 0;
      position: relative;
    }

    .section-header {
      max-width: 700px;
      margin-bottom: 46px;
    }

    .eyebrow {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      color: #a67b14;
      font-size: 0.76rem;
      font-weight: 800;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      margin-bottom: 13px;
    }

    .eyebrow::before {
      content: "";
      width: 26px;
      height: 2px;
      background: var(--gold);
      border-radius: 10px;
    }

    .section-title {
      font-family: "Manrope", sans-serif;
      font-size: clamp(2rem, 5vw, 3.15rem);
      line-height: 1.1;
      letter-spacing: -0.045em;
      color: var(--navy);
      margin-bottom: 16px;
    }

    .section-description {
      color: var(--muted);
      font-size: 1rem;
      max-width: 650px;
    }

    /* =========================
       BUTTONS
    ========================== */

    .btn {
      min-height: 49px;
      padding: 0 20px;
      border-radius: 12px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 0.9rem;
      transition:
        transform 0.25s ease,
        box-shadow 0.25s ease,
        background 0.25s ease;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn-primary {
      background: var(--gold);
      color: var(--navy);
      box-shadow: 0 9px 25px rgba(229, 184, 75, 0.25);
    }

    .btn-primary:hover {
      background: var(--gold-light);
      box-shadow: 0 13px 32px rgba(229, 184, 75, 0.32);
    }

    .btn-dark {
      background: var(--navy);
      color: var(--white);
      box-shadow: 0 10px 25px rgba(7, 26, 53, 0.15);
    }

    .btn-dark:hover {
      background: var(--navy-2);
    }

    .btn-outline {
      border-color: rgba(255, 255, 255, 0.3);
      color: white;
      background: rgba(255, 255, 255, 0.05);
    }

    .btn-outline:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    .phone-icon {
      width: 17px;
      height: 17px;
    }

    /* =========================
       NAVBAR
    ========================== */

    .navbar {
      position: fixed;
      inset: 0 0 auto;
      z-index: 1000;
      background: rgba(255, 255, 255, 0.94);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid rgba(7, 26, 53, 0.07);
    }

    .nav-inner {
      min-height: 76px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      min-width: 0;
    }

    .brand-logo {
      width: 49px;
      height: 49px;
      object-fit: contain;
      flex: 0 0 auto;
    }

    .brand-text {
      font-family: "Manrope", sans-serif;
      font-size: 0.86rem;
      line-height: 1.12;
      font-weight: 800;
      color: var(--navy);
      max-width: 170px;
    }

    .nav-links {
      display: none;
      align-items: center;
      gap: 22px;
    }

    .nav-links a {
      font-size: 0.83rem;
      font-weight: 600;
      color: #44526a;
      transition: color 0.2s ease;
    }

    .nav-links a:hover {
      color: var(--navy);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .nav-call {
      min-height: 42px;
      padding: 0 14px;
      font-size: 0.78rem;
    }

    .menu-toggle {
      width: 43px;
      height: 43px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: white;
      color: var(--navy);
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .hamburger {
      width: 19px;
      display: grid;
      gap: 4px;
    }

    .hamburger span {
      display: block;
      height: 2px;
      border-radius: 4px;
      background: currentColor;
      transition: 0.25s ease;
    }

    .menu-toggle.active .hamburger span:nth-child(1) {
      transform: translateY(6px) rotate(45deg);
    }

    .menu-toggle.active .hamburger span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active .hamburger span:nth-child(3) {
      transform: translateY(-6px) rotate(-45deg);
    }

    .mobile-menu {
      display: none;
      padding: 8px 0 18px;
      border-top: 1px solid rgba(7, 26, 53, 0.06);
      background: rgba(255, 255, 255, 0.98);
    }

    .mobile-menu.active {
      display: block;
    }

    .mobile-menu a {
      display: block;
      padding: 12px 2px;
      font-weight: 600;
      color: #43516a;
    }

    /* =========================
       HERO
    ========================== */

    .hero {
      min-height: 100svh;
      padding-top: 76px;
      background:
        radial-gradient(
          circle at 85% 15%,
          rgba(229, 184, 75, 0.13),
          transparent 30%
        ),
        linear-gradient(135deg, #06172e 0%, #0b2548 58%, #071a35 100%);
      color: white;
      position: relative;
      overflow: hidden;
      display: flex;
      align-items: center;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 340px;
      height: 340px;
      border: 1px solid rgba(229, 184, 75, 0.16);
      border-radius: 50%;
      right: -170px;
      top: 90px;
    }

    .hero::after {
      content: "";
      position: absolute;
      width: 520px;
      height: 520px;
      border: 1px solid rgba(255, 255, 255, 0.045);
      border-radius: 50%;
      left: -330px;
      bottom: -260px;
    }

    .hero-grid {
      position: relative;
      z-index: 2;
      display: grid;
      gap: 42px;
      padding: 65px 0 80px;
    }

    .hero-content {
      max-width: 700px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 9px;
      padding: 7px 11px;
      border: 1px solid rgba(229, 184, 75, 0.3);
      background: rgba(229, 184, 75, 0.08);
      color: var(--gold-light);
      border-radius: 999px;
      font-size: 0.72rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      margin-bottom: 20px;
    }

    .hero-badge span {
      width: 7px;
      height: 7px;
      background: var(--gold);
      border-radius: 50%;
      box-shadow: 0 0 0 5px rgba(229, 184, 75, 0.08);
    }

    .hero h1 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(2.65rem, 10vw, 5.8rem);
      line-height: 0.98;
      letter-spacing: -0.06em;
      margin-bottom: 21px;
    }

    .hero h1 .gold {
      color: var(--gold);
    }

    .hero-location {
      display: flex;
      align-items: center;
      gap: 8px;
      color: rgba(255, 255, 255, 0.8);
      font-weight: 600;
      margin-bottom: 11px;
    }

    .hero-location svg {
      color: var(--gold);
      width: 17px;
    }

    .hero-subtitle {
      color: rgba(255, 255, 255, 0.72);
      font-size: clamp(1rem, 2vw, 1.18rem);
      margin-bottom: 30px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 11px;
    }

    .hero-image-wrap {
      position: relative;
      max-width: 650px;
      margin-inline: auto;
      width: 100%;
    }

    .hero-image-card {
      position: relative;
      overflow: hidden;
      border-radius: 25px;
      border: 1px solid rgba(255, 255, 255, 0.14);
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.3);
      background: #102b4d;
      aspect-ratio: 4 / 3;
    }

    .hero-image-card::after {
      content: "";
      position: absolute;
      inset: 0;
      background: linear-gradient(
        to top,
        rgba(3, 13, 28, 0.5),
        transparent 58%
      );
      pointer-events: none;
    }

    .hero-image {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .hero-founder-tag {
      position: absolute;
      left: 17px;
      bottom: 17px;
      z-index: 2;
      background: rgba(7, 26, 53, 0.78);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.14);
      border-radius: 13px;
      padding: 10px 14px;
      font-size: 0.76rem;
    }

    .hero-founder-tag strong {
      display: block;
      color: white;
      font-size: 0.88rem;
    }

    .hero-founder-tag span {
      color: rgba(255, 255, 255, 0.65);
    }

    /* =========================
       ABOUT
    ========================== */

    .about {
      background: var(--off-white);
    }

    .about-grid {
      display: grid;
      gap: 35px;
      align-items: center;
    }

    .about-copy p {
      color: var(--muted);
      font-size: 1.04rem;
      max-width: 720px;
    }

    .about-card {
      padding: 28px;
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      position: relative;
      overflow: hidden;
    }

    .about-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 5px;
      height: 100%;
      background: var(--gold);
    }

    .about-card-label {
      font-size: 0.75rem;
      font-weight: 800;
      color: #9a7318;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      margin-bottom: 8px;
    }

    .about-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 1.45rem;
      color: var(--navy);
      margin-bottom: 8px;
    }

    .about-card p {
      color: var(--muted);
      font-size: 0.92rem;
    }

    /* =========================
       COURSES
    ========================== */

    .courses {
      background: white;
    }

    .courses-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 17px;
    }

    .course-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 25px;
      min-height: 295px;
      display: flex;
      flex-direction: column;
      box-shadow: 0 8px 30px rgba(7, 26, 53, 0.055);
      transition:
        transform 0.3s ease,
        box-shadow 0.3s ease,
        border-color 0.3s ease;
      position: relative;
      overflow: hidden;
    }

    .course-card::after {
      content: "";
      position: absolute;
      width: 130px;
      height: 130px;
      border-radius: 50%;
      background: rgba(229, 184, 75, 0.06);
      right: -55px;
      top: -55px;
      pointer-events: none;
    }

    .course-card:hover {
      transform: translateY(-5px);
      border-color: rgba(229, 184, 75, 0.5);
      box-shadow: 0 20px 45px rgba(7, 26, 53, 0.1);
    }

    .course-image {
      width: 100%;
      height: 145px;
      border-radius: 14px;
      overflow: hidden;
      background: #edf1f6;
      margin-bottom: 20px;
    }

    .course-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .course-icon {
      width: 52px;
      height: 52px;
      display: grid;
      place-items: center;
      background: #fdf6e3;
      color: #a67913;
      border-radius: 15px;
      margin-bottom: 20px;
    }

    .course-icon svg {
      width: 25px;
      height: 25px;
    }

    .course-card h3 {
      font-family: "Manrope", sans-serif;
      color: var(--navy);
      font-size: 1.18rem;
      line-height: 1.25;
      margin-bottom: 10px;
    }

    .course-card p {
      color: var(--muted);
      font-size: 0.89rem;
      margin-bottom: 13px;
    }

    .subjects {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin-bottom: 20px;
    }

    .subject {
      padding: 5px 9px;
      border-radius: 999px;
      background: #f2f5f9;
      color: #4b5c73;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .course-card .btn {
      margin-top: auto;
      width: 100%;
    }

    /* =========================
       FOUNDER
    ========================== */

    .founder {
      background: var(--off-white);
    }

    .founder-card {
      background: var(--navy);
      border-radius: 26px;
      overflow: hidden;
      display: grid;
      box-shadow: 0 25px 65px rgba(7, 26, 53, 0.16);
    }

    .founder-image {
      min-height: 360px;
      background: #102b4d;
    }

    .founder-image img {
      width: 100%;
      height: 100%;
      min-height: 360px;
      object-fit: cover;
    }

    .founder-content {
      padding: 40px 28px;
      color: white;
      display: flex;
      flex-direction: column;
      justify-content: center;
      background:
        radial-gradient(
          circle at 100% 0,
          rgba(229, 184, 75, 0.12),
          transparent 38%
        ),
        var(--navy);
    }

    .founder-content .eyebrow {
      color: var(--gold-light);
    }

    .founder-content h2 {
      font-family: "Manrope", sans-serif;
      font-size: clamp(2rem, 7vw, 3.5rem);
      letter-spacing: -0.05em;
      line-height: 1.05;
      margin-bottom: 13px;
    }

    .founder-role {
      color: rgba(255, 255, 255, 0.65);
      font-size: 0.96rem;
    }

    .founder-achievement {
      margin-top: 28px;
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.12);
      cursor: pointer;
      max-width: 330px;
    }

    .founder-achievement img {
      width: 100%;
      height: 170px;
      object-fit: cover;
    }

    .founder-achievement-caption {
      padding: 10px 12px;
      font-size: 0.72rem;
      color: rgba(255, 255, 255, 0.62);
      background: rgba(255, 255, 255, 0.04);
    }

    /* =========================
       ACHIEVEMENTS
    ========================== */

    .achievements {
      background: white;
    }

    .achievement-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 18px;
    }

    .achievement-card {
      border-radius: 20px;
      overflow: hidden;
      background: var(--off-white);
      border: 1px solid var(--border);
      cursor: pointer;
      position: relative;
    }

    .achievement-image-wrap {
      aspect-ratio: 4 / 3;
      overflow: hidden;
    }

    .achievement-card img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.45s ease;
    }

    .achievement-card:hover img {
      transform: scale(1.04);
    }

    .achievement-info {
      padding: 18px;
    }

    .achievement-info h3 {
      font-family: "Manrope", sans-serif;
      font-size: 1rem;
      color: var(--navy);
      margin-bottom: 4px;
    }

    .achievement-info p {
      color: var(--muted);
      font-size: 0.8rem;
    }

    .artwork-note {
      margin-top: 22px;
      padding: 14px 16px;
      border-left: 3px solid var(--gold);
      background: #fffbf0;
      color: #6d5b31;
      border-radius: 8px;
      font-size: 0.78rem;
    }

    /* =========================
       GALLERY
    ========================== */

    .gallery {
      background: var(--off-white);
    }

    .gallery-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 10px;
    }

    .gallery-item {
      aspect-ratio: 1 / 1;
      border-radius: 15px;
      overflow: hidden;
      cursor: pointer;
      background: #dfe5ed;
      position: relative;
    }

    .gallery-item.wide {
      grid-column: span 2;
      aspect-ratio: 16 / 9;
    }

    .gallery-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition:
        transform 0.4s ease,
        filter 0.4s ease;
    }

    .gallery-item:hover img {
      transform: scale(1.045);
      filter: brightness(0.88);
    }

    /* =========================
       CONTACT
    ========================== */

    .contact {
      background: white;
    }

    .contact-grid {
      display: grid;
      gap: 20px;
    }

    .contact-card {
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 27px;
      box-shadow: 0 9px 35px rgba(7, 26, 53, 0.055);
    }

    .contact-card h3 {
      font-family: "Manrope", sans-serif;
      font-size: 1.2rem;
      color: var(--navy);
      margin-bottom: 18px;
    }

    .contact-row {
      display: flex;
      align-items: flex-start;
      gap: 13px;
      padding: 13px 0;
      border-bottom: 1px solid rgba(7, 26, 53, 0.07);
    }

    .contact-row:last-of-type {
      border-bottom: 0;
    }

    .contact-icon {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: #fdf6e3;
      color: #a67913;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
    }

    .contact-icon svg {
      width: 18px;
      height: 18px;
    }

    .contact-label {
      font-size: 0.72rem;
      color: #8290a4;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      margin-bottom: 2px;
    }

    .contact-value {
      color: var(--navy);
      font-weight: 600;
      font-size: 0.92rem;
    }

    .contact-buttons {
      display: grid;
      gap: 10px;
      margin-top: 18px;
    }

    .map-preview {
      min-height: 180px;
      border-radius: 16px;
      background:
        linear-gradient(rgba(7, 26, 53, 0.78), rgba(7, 26, 53, 0.88)),
        repeating-linear-gradient(
          45deg,
          #dfe5ed 0,
          #dfe5ed 10px,
          #edf1f6 10px,
          #edf1f6 20px
        );
      display: grid;
      place-items: center;
      text-align: center;
      padding: 25px;
      color: white;
      margin-bottom: 20px;
    }

    .map-preview svg {
      width: 32px;
      margin-bottom: 8px;
      color: var(--gold);
